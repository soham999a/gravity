name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The app IS the repo root (there is no _soham-gravity/ subfolder on GitHub).
      - run: npm ci || npm install
      - run: npm run build
      # test:prod is a live smoke test — it needs a running production server.
      - name: Prod smoke test
        run: |
          npm run start &
          npx wait-on http://localhost:3000/api/health -t 90000
          npm run test:prod
